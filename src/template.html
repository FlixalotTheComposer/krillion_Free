<style>
:root{--accent:#ffb347;--text:#e8f6ff;--muted:#8fb4c9;--kb:0px}

@keyframes flick{0%,93%,100%{text-shadow:4px 0 #ff4f9a,-4px 0 #22d8ff}95%{text-shadow:-6px 2px #ff4f9a,6px -2px #22d8ff}97%{text-shadow:2px 0 #ff4f9a,-2px 0 #22d8ff}}

.pb:hover{background:rgba(255,255,255,.12)}

td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.12)}

.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}

.seg{display:flex;justify-content:center;margin:2px 0 4px}

.seg button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.12);position:relative;z-index:1}
.mdesc{color:#fff;font-size:17px;line-height:1.15;margin:4px auto 10px;max-width:440px;text-shadow:2px 2px 0 #000;min-height:40px}

.smsg{display:inline-block;margin:0 0 6px;padding:4px 10px;color:#ff8a80;background:rgba(4,12,24,.85);border:2px solid #ef5350;box-shadow:0 0 0 2px #000;font-size:18px;animation:pulse .4s 1}
.dym{color:var(--muted);font-size:15px;letter-spacing:2px;margin-right:4px;text-shadow:2px 2px 0 #000}
.chip{font:inherit;font-size:20px;color:var(--text);background:rgba(4,12,24,.9);border:2px solid var(--accent);box-shadow:0 0 0 2px #000;padding:2px 10px;margin:3px;cursor:pointer}
.chip.dim{border-color:rgba(255,255,255,.3);font-size:16px;color:var(--muted)}
.chip:active{transform:translateY(2px)}
@media (max-width:360px){.hb{padding:5px 8px}.hb b{font-size:19px}small{font-size:12px;letter-spacing:1px}#pips{gap:3px}#pips i{width:9px;height:9px;border-width:1px}.ib{width:34px;height:34px;font-size:18px}#tools{top:calc(max(10px,env(safe-area-inset-top)) + 58px)}.q{top:calc(max(10px,env(safe-area-inset-top)) + 66px)}.pb{font-size:20px;padding:6px 12px}.pb.big{font-size:24px}.clock{min-width:44px;font-size:24px}.bar input{font-size:20px}.title h1{letter-spacing:4px}.fb .t{font-size:28px}}
@media (prefers-reduced-motion:reduce){.title h1{animation:none}}
</style>

<canvas id="scene"></canvas><div id="vig"></div><div id="scan"></div><div id="flash"></div>
<div id="hud">
  <div class="box hb"><small>DEPTH</small><b id="depth">0m</b></div>
  <div id="pips"></div>
  <div class="box hb r"><small>SCORE</small><b id="score">0</b></div>
</div>
<div id="tools"><button class="ib" id="bMute" title="Sound">&#9834;</button><button class="ib" id="bTheme" title="Colour theme">&#9680;</button></div>
<div id="zone"></div><div id="slam"></div><div id="toast"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixRGB=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=c=>"rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/c\+\+/g,"cpp").replace(/([cfj])#/g,"$1sharp").replace(/&/g," and ").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function seedRng(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= data prep + matching ================= */
function prepPrompt(p){p[1]=p[1].filter(a=>a[1]>0);p.total=p[1].reduce((s,a)=>s+a[1],0);p.idx=new Map();
  p[1].forEach(e=>{[e[0]].concat(e[2]||[]).forEach(n=>{const k=norm(n).replace(/^the /,"");if(!p.idx.has(k))p.idx.set(k,e);const ns=k.replace(/ /g,"");if(!p.idx.has(ns))p.idx.set(ns,e)})});return p}
P.forEach(prepPrompt);
/* "Did you mean": close spellings and name prefixes, never a full list of answers */
function suggest(p,input){
  const x=norm(input).replace(/^(a|an|the|my) /,"");if(x.length<3)return[];
  const lim=x.length>=9?3:x.length>=5?2:1,seen=new Map();
  for(const [k,e] of p.idx){if(k.length<3)continue;let d=null;
    if(x.length>=4&&k.startsWith(x))d=.5;else if(Math.abs(k.length-x.length)<=lim){const l=lev(k,x);if(l<=lim)d=l}
    if(d!==null&&(!seen.has(e)||seen.get(e)>d))seen.set(e,d)}
  return [...seen.entries()].sort((a,b)=>a[1]-b[1]||b[0][1]-a[0][1]).slice(0,3).map(en=>en[0][0])}
function variants(x){const out=[x];const w=x.replace(/^(a|an|the|my) /,"");out.push(w);if(/ies$/.test(w))out.push(w.slice(0,-3)+"y");if(/es$/.test(w))out.push(w.slice(0,-2));if(/s$/.test(w))out.push(w.slice(0,-1));out.push(w.replace(/ /g,""));return out}
function match(p,input){
  const x=norm(input);if(!x)return null;
  for(const v of variants(x)){const e=p.idx.get(v);if(e)return e}
  const w=x.replace(/^(a|an|the|my) /,"");
  if(w.length>=5){const lim=w.length>=9?2:1;let best=null,bd=9;
    for(const [k,e] of p.idx){if(k.length<5||Math.abs(k.length-w.length)>lim)continue;const d=lev(k,w);if(d<=lim&&d<bd){bd=d;best=e}}
    if(best)return best}
  return null;
}
const TIERS=[
 {name:"COMMON",col:"#b0bec5",m:150,i:0},
 {name:"UNCOMMON",col:"#81c784",m:400,i:1},
 {name:"RARE",col:"#64b5f6",m:700,i:2},
 {name:"EPIC",col:"#ba68c8",m:900,i:3},
 {name:"LEGENDARY",col:"#ffd54f",m:1100,i:4}];
const tierFor=pct=>pct>=8?TIERS[0]:pct>=2?TIERS[1]:pct>=.5?TIERS[2]:pct>=.1?TIERS[3]:TIERS[4];
const ROUNDS=7,TIME=25,GOAL=7000,HULL=3;   /* HULL: misses you can survive before the dive ends */

/* ================= themes ================= */
const THEMES=[
 {name:"DEEP BLUE",sky:["#6ec3f5","#cdeeff"],sun:"#fff3b0",water:["#2c92cc","#1c63a0","#0d3463","#06142e","#030814","#010208"],accent:"#ffb347",fish:"#ffb347",glow:"#7ffcff",cloud:"#ffffff",sw:"#1c63a0"},
 {name:"SUNSET REEF",sky:["#ff6f61","#ffc27a"],sun:"#fff1a8",water:["#e0627a","#9a3f78","#4e2063","#240f40","#10072a","#05020f"],accent:"#ffd166",fish:"#ffe08a",glow:"#ff8ad8",cloud:"#ffd6c9",sw:"#e0627a"},
 {name:"NEON ABYSS",sky:["#1a0a3a","#4a1f8a"],sun:"#ff4fd8",water:["#22308a","#141c63","#0b1042","#06082a","#03041a","#010108"],accent:"#00ffd0",fish:"#ff4fd8",glow:"#00ffd0",cloud:"#6b3fb5",sw:"#4a1f8a"},
 {name:"GAMEBOY",sky:["#9bbc0f","#c5d98a"],sun:"#e0f8d0",water:["#8bac0f","#6a8a14","#306230","#1d4a1d","#0f380f","#071e07"],accent:"#e0f8d0",fish:"#0f380f",glow:"#e0f8d0",cloud:"#e0f8d0",sw:"#6a8a14"},
 {name:"KELP FOREST",sky:["#a8e6cf","#e3f6d8"],sun:"#fff7b0",water:["#43b581","#238a6c","#10525a","#08303a","#041a24","#010a10"],accent:"#f6e05e",fish:"#f6e05e",glow:"#b8ff9a",cloud:"#ffffff",sw:"#238a6c"}];
THEMES.forEach(t=>{t.w=t.water.map(hexRGB);t.s=t.sky.map(hexRGB);t.fishC=hexRGB(t.fish);t.glowC=hexRGB(t.glow)});
let themeIdx=clamp(store.get("kr_theme",0)|0,0,THEMES.length-1),theme=THEMES[themeIdx];
function setTheme(i,say){themeIdx=i;theme=THEMES[i];store.set("kr_theme",i);document.documentElement.style.setProperty("--accent",theme.accent);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=theme.water[2];
  document.querySelectorAll(".sw button").forEach((b,j)=>b.classList.toggle("on",j===i));if(say)toast(theme.name)}
const ZB=[0,200,1000,4000,6000,7000];
function wcol(m){m=clamp(m,0,7000);let i=0;while(i<4&&m>ZB[i+1])i++;return mixRGB(theme.w[i],theme.w[i+1],(m-ZB[i])/(ZB[i+1]-ZB[i]))}
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1400)}

/* ================= sound (synthesised, no files) ================= */
const AU={ctx:null,master:null,muted:store.get("kr_mute",false),dr:null,
 init(){if(!this.ctx){try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.8;this.master.connect(this.ctx.destination)}catch(e){this.ctx=null}}
  if(this.ctx&&this.ctx.state!=="running"&&this.ctx.resume)this.ctx.resume()},
 setMute(m){this.muted=m;store.set("kr_mute",m);if(this.master)this.master.gain.value=m?0:.8},
 tone(f,d,type,vol,to,at){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03)},
 noise(d,vol,f0,f1){if(!this.ctx)return;const c=this.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.Q.value=1.1;const t=c.currentTime;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(this.master);s.start(t)},
 click(){this.tone(660,.05,"square",.04)},
 blub(){this.tone(260,.14,"sine",.09,640)},
 tick(){this.tone(1100,.03,"square",.03)},
 chime(i){const N=[523,659,784,1047,1319];for(let k=0;k<=i;k++)this.tone(N[k],.2,"triangle",.08,0,k*.075)},
 miss(){this.tone(160,.32,"sawtooth",.06,55)},
 sink(){this.noise(1.7,.14,1000,160);this.tone(220,1.4,"sine",.05,60)},

  S.pf[i]=(async()=>{
    const tp=pickTopic(i);for(let t=0;t<2;t++){try{const r=await Promise.race([pywebview.api.gen_prompt(tp[t],S.used.slice(-12)),new Promise(res=>setTimeout(()=>res(null),120000))]);
      if(r&&r.ok&&r.answers&&r.answers.length>=12){const p=[r.prompt,r.answers.map((a,k)=>[a,100/Math.pow(k+1,1.05)])];prepPrompt(p);p.ai=true;S.used.push(r.prompt);S.qs[i]=p;return}}catch(e){}}
    const pool=P.filter(x=>!S.used.includes(x[0])),f=(pool.length?pool:P)[Math.floor(Math.random()*(pool.length||P.length))];S.used.push(f[0]);S.qs[i]=f;S.fallbacks=(S.fallbacks||0)+1})();
  return S.pf[i]}
async function askNext(){const S=st;if(!S)return;
  if(S.endless&&!S.qs[S.i]){S.phase="waiting";ui.innerHTML='<div class="fb box" style="animation:none;opacity:1"><div class="t">QWEN IS WRITING...</div><p>Inventing your next prompt. This takes a few seconds.</p></div>';await fetchPrompt(S.i);if(st!==S)return}
  ask();if(S.endless)fetchPrompt(S.i+1)}

/* ---- one prompt ---- */
function ask(){const p=st.qs[st.i];st.phase="answering";st.sub=false;st.tries=0;st.skip=false;st.timeUp=false;pips();
  st.deadline=performance.now()+TIME*1000;st.lastSec=TIME;renderAsk(p)}
function renderAsk(p,msg,sug){
  ui.innerHTML='<div class="q box"'+(st.tries?' style="animation:none"':'')+'><small>PROMPT '+(st.endless?st.i+1:(st.i+1)+" / "+ROUNDS)+(st.tries?" &middot; TRY "+(st.tries+1):"")+'</small><h2>'+esc(p[0])+'</h2><small style="font-size:14px">&#9662; rarer answers sink deeper'+(p.ai?" &middot; written by Qwen":"")+(st.fallbacks&&!p.ai&&st.endless?" &middot; offline prompt":"")+'</small></div>'+
   '<div class="sg" id="sg"></div><div class="tbar"><i id="tb"></i></div><form class="bar" id="f" autocomplete="off"><div class="clock" id="clk">'+Math.max(0,Math.ceil((st.deadline-performance.now())/1000))+'</div><input id="ans" type="text" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="type your answer..."><button class="pb" type="submit" style="margin:0">DIVE</button></form>';
  const sg=$("#sg");
  if(msg){const m=document.createElement("div");m.className="smsg";m.textContent=msg;sg.appendChild(m)}
  if(sug&&sug.length){const d=document.createElement("div");d.innerHTML='<span class="dym">DID YOU MEAN</span>';
    sug.forEach(s=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=s;b.onclick=()=>{AU.click();$("#ans").value=s;submit()};d.appendChild(b)});sg.appendChild(d)}
  if(st.mode==="classic"){const b=document.createElement("button");b.type="button";b.className="chip dim";b.textContent="SKIP ▶";b.onclick=()=>{AU.click();st.skip=true;submit()};sg.appendChild(b)}
  const inp=$("#ans");setTimeout(()=>inp.focus(),50);
  $("#f").onsubmit=e=>{e.preventDefault();submit()};
  inp.oninput=()=>{if(Math.random()<.5)AU.tone(500+Math.random()*300,.03,"square",.015)};
}
function tickClock(now){const left=Math.max(0,(st.deadline-now)/1000),tb=$("#tb"),clk=$("#clk");if(!tb)return;tb.style.width=(left/TIME*100)+"%";const s=Math.ceil(left);
  if(s!==st.lastSec){st.lastSec=s;clk.textContent=s;if(s<=5&&s>0)AU.tick();clk.classList.toggle("low",s<=5)}
  if(left<=0){st.timeUp=true;submit()}}
function submit(){if(!st||st.phase!=="answering"||st.sub)return;const inp=$("#ans"),raw=st.skip?"":(inp?inp.value:"");
  if(st.mode==="classic"&&!raw.trim()&&!st.skip&&!st.timeUp){if(inp)inp.focus();return}   /* an empty Enter is not a skip */
  st.sub=true;if(inp)inp.blur();resolve(raw)}
/* Qwen edition only: the desktop app exposes pywebview.api.judge(); the web version never has it. */
const KRAI={edition:false,ok:false,name:"",judge:async()=>false},AI_PCT=.15;
function badge(){const b=$("#aib");if(b){b.textContent=KRAI.ok?"QWEN AI JUDGE ONLINE ("+KRAI.name+")":(KRAI.edition?"QWEN AI JUDGE OFFLINE - start Ollama and pull a qwen model":"");b.style.color=KRAI.ok?"var(--accent)":"#ef9a9a"}
  const eb=$("#endless");if(eb){eb.style.display=KRAI.edition?"":"none";eb.disabled=!KRAI.ok}}
window.addEventListener("pywebviewready",async()=>{try{KRAI.edition=true;const s=await pywebview.api.status();if(s&&s.ok){KRAI.ok=true;KRAI.name=s.model;
  KRAI.judge=async(q,a)=>{try{const r=await Promise.race([pywebview.api.judge(q,a),new Promise(res=>setTimeout(()=>res(null),35000))]);return !!(r&&r.ok&&r.valid)}catch(e){return false}}}
  badge()}catch(e){}});
async function resolve(raw){
  const S=st,p=S.qs[S.i];let e=match(p,raw),ai=false;
  if(!e&&raw.trim()&&KRAI.ok&&!S.timeUp){S.phase="judging";const t0=performance.now(),sg=$("#sg");
    if(sg&&S.mode==="classic")sg.innerHTML='<div class="smsg">ASKING QWEN...</div>';
    else ui.innerHTML='<div class="fb box" style="animation:none;opacity:1"><div class="t">ASKING QWEN...</div><p>Checking whether "'+esc(raw.trim())+'" counts.</p></div>';
    const ok=await KRAI.judge(p[0],raw.trim());if(st!==S||S.phase!=="judging")return;
    S.deadline+=performance.now()-t0;   /* the clock waits while the AI thinks */
    if(ok){e=[raw.trim(),p.total*AI_PCT/100,[]];ai=true}}
  if(!e&&S.mode==="classic"&&raw.trim()&&!S.timeUp&&!S.skip&&(S.deadline-performance.now())>500){retry(raw,p);return}
  showResult(raw,e,ai);
}
function retry(raw,p){st.tries++;st.phase="answering";st.sub=false;AU.miss();sc.shake=.3;
  renderAsk(p,'"'+raw.trim()+'" is not on our list. Try again!',suggest(p,raw))}
function showResult(raw,e,ai){
  const S=st,p=S.qs[S.i];S.phase="feedback";
  let pct=null,tier=null,pts=0,score=0;
  const f=S.mode==="classic"?1-.1*Math.min(S.tries||0,5):1;
  if(e){pct=e[1]/p.total*100;tier=tierFor(pct);pts=Math.round(tier.m*(.88+.12*clamp(1-pct/10,0,1))*f);score=Math.round(100*Math.log2(1+100/pct)*f)}
  const before=S.depth;S.depth=Math.min(GOAL,S.depth+pts);S.score+=score;
  S.log.push({q:p[0],a:raw.trim()||"-",pts,score,tier,pct,ai,tries:S.tries||0});pips();
  const gain=S.depth-before;
  if(S.endless&&S.depth>=GOAL&&!S.reached){S.reached=true;toast("ABYSS REACHED - keep going!")}
  if(tier){AU.blub();AU.sink();sc.anim={from:sc.depth,to:S.depth,t0:performance.now(),dur:1300+tier.i*260,done:()=>{sc.shake=tier.i>=2?.4+tier.i*.15:.1;if(tier.i>=3){const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go")};sc.ring.push({r:2});AU.chime(tier.i);setScore(S.score);slam(tier.name,tier.col)}}}
  else{if(S.hull!=null)S.hull--;pips();AU.miss();sc.shake=.8;
    const fl=$("#flash");fl.style.background="#ff2a2a";fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");setTimeout(()=>{fl.style.background=""},700);
    setTimeout(()=>slam(S.hull==null?"TIME'S UP":S.hull>0?"HULL DAMAGED":"HULL BREACHED","#ef5350"),150)}
  const top=p[1].slice().sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bars=top.map(a=>{const v=a[1]/p.total*100;return '<div class="bar2'+(e&&a===e?" me":"")+'"><span class="n">'+esc(a[0])+'</span><span class="b"><i style="width:'+Math.min(v*2.5,100)+'%"></i></span><span class="p">'+v.toFixed(v<1?2:1)+"%</span></div>"}).join("");
  const sunk=!e&&S.hull!=null&&S.hull<=0;S.sunk=sunk;
  const last=sunk||(!S.endless&&S.i+1>=ROUNDS);
  const typed=norm(raw).replace(/^(a|an|the|my) /,""),fixed=e&&!ai&&typed&&!variants(norm(raw)).some(v=>p.idx.has(v));
  const notes=(fixed?'<p style="color:var(--muted)">spelling corrected: counted as <b style="color:#fff">'+esc(e[0])+"</b></p>":"")+(ai?'<p style="color:var(--muted)">not on our lists, but Qwen says it counts</p>':"")+(e&&S.tries?'<p style="color:var(--muted)">found on try '+(S.tries+1)+" &middot; -"+S.tries*10+"% depth</p>":"");
  ui.innerHTML='<div class="fb box">'+(e?'<div class="t" style="color:'+tier.col+'">'+tier.name+'</div><p>"'+esc(raw.trim()||e[0])+'" was given by <b>'+pct.toFixed(pct<1?2:1)+'%</b> of divers</p><div class="pts">+'+gain+'m &nbsp; +'+score+' pts</div>'+notes:
   '<div class="t" style="color:#ef5350">'+(S.hull==null?(S.skip?"SKIPPED":"TIME'S UP"):sunk?"HULL BREACHED":"HULL DAMAGED")+'</div><p>'+(raw.trim()?'"'+esc(raw.trim())+'" isn\'t on our list for this prompt.':(S.skip?"You skipped this one.":"Time ran out."))+'</p>'+(S.hull!=null?'<div class="pts" style="color:#ef5350">-1 &#9829; &nbsp;'+Math.max(0,S.hull)+' left</div>':"")+(sunk?'<p>Your sub can\'t take any more. The dive ends here.</p>':"")+'<p style="color:var(--muted)">Top answer: <b style="color:#fff">'+esc(top[0][0])+"</b></p>")+
   '<div class="bars"><small>top answers</small>'+bars+'</div><button class="pb" id="nx">'+(last?"SURFACE":"NEXT")+' &#9654;</button></div>';
  const nx=$("#nx");nx.disabled=true;setTimeout(()=>{nx.disabled=false;nx.focus()},tier?1400+tier.i*260:900);
  nx.onclick=()=>{AU.click();S.i++;if(sunk||(!S.endless&&S.i>=ROUNDS))finish();else askNext()};
  nx.onkeydown=ev=>{if(ev.repeat)ev.preventDefault()};
}
function slam(txt,col){const e=$("#slam");e.textContent=txt;e.style.color=col;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
function finish(replay){
  st.phase="done";AU.droneOff();pips();["#slam","#zone"].forEach(function(q){$(q).classList.remove("go")});
  const m=st.mode,d=st.depth,sco=st.score,prevBest=best(m);
  if(!replay){if(sco>prevBest)store.set(bestKey(m),sco);const h=store.get("kr_hist",[]);h.unshift({date:today(),mode:st.daily?"Daily":st.endless?"Endless":"Random",rules:m,depth:d,score:sco});store.set("kr_hist",h.slice(0,30));if(st.daily)store.set("kr_daily_"+m+"_"+today(),{depth:d,score:sco,log:st.log});AU.fan()}
  const win=d>=GOAL,emo={COMMON:"⬜",UNCOMMON:"🟩",RARE:"🟦",EPIC:"🟪",LEGENDARY:"🟨"},name={classic:"Classic",oneshot:"One Shot",endless:"Endless AI"}[m];
  const share="Krillion "+name+" "+(st.daily?today():"(random)")+"\nDepth: "+d+"m"+(win?" TROPHY":"")+"  Score: "+sco+(st.endless?"  Rounds: "+st.log.length:"")+"\n"+st.log.map(l=>l.tier?emo[l.tier.name]:"⬛").join("");
  ui.innerHTML='<div class="done box"><h1>'+(win&&!st.endless?"ABYSS REACHED!":st.sunk?"HULL BREACHED!":st.endless?"DIVE OVER":"SURFACING...")+'</h1><div class="big">'+d+'m</div><div style="color:#fff">SCORE '+sco+(st.endless?" &middot; "+st.log.length+" ROUNDS":"")+(sco>=Math.max(prevBest,sco)&&!replay&&sco>prevBest?" &nbsp;NEW BEST!":" &nbsp;(best "+best(m)+")")+'</div><div style="color:var(--muted)">'+name.toUpperCase()+"</div>"+(replay?'<div style="color:var(--muted)">You already did today\'s '+name+' dive. Come back tomorrow!</div>':"")+
   "<table>"+st.log.map(l=>'<tr><td><span class="qs">'+esc(l.q)+'</span><br>'+esc(l.a)+(l.tries?' <span class="qs">(try '+(l.tries+1)+")</span>":"")+'</td><td class="r" style="color:'+(l.tier?l.tier.col:"#ef9a9a")+'">'+(l.tier?l.tier.name:"MISS")+'</td></tr>').join("")+"</table>"+
   '<button class="pb" id="cp">COPY RESULT</button><button class="pb dim" id="rnd">'+(st.endless?"AGAIN":"RANDOM DIVE")+'</button><button class="pb dim" id="mn">MENU</button></div>';
  $("#cp").onclick=()=>{AU.click();const b=$("#cp");try{navigator.clipboard.writeText(share).then(()=>{b.textContent="COPIED!"},()=>prompt("Copy:",share))}catch(e){prompt("Copy:",share)}};
  $("#rnd").onclick=()=>{AU.click();if(st.endless)startEndless();else{mode=st.mode;start(false)}};$("#mn").onclick=()=>{AU.click();title()};
}

/* ================= wiring ================= */
const bm=$("#bMute");const showMute=()=>{bm.textContent=AU.muted?"✕":"♪";bm.style.opacity=AU.muted?.6:1};showMute();
bm.onclick=()=>{AU.init();AU.setMute(!AU.muted);showMute();AU.click();toast(AU.muted?"SOUND OFF":"SOUND ON")};
$("#bTheme").onclick=()=>{AU.click();setTheme((themeIdx+1)%THEMES.length,true)};
setTheme(themeIdx);title();requestAnimationFrame(frame);
</script>
