<title>Krillion Clone</title>
<style>
:root{--accent:#ffb347;--text:#e8f6ff;--muted:#8fb4c9;--kb:0px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:"VT323",Consolas,Menlo,"SF Mono","Courier New",monospace;font-weight:700;font-size:19px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;height:100dvh}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#scan{position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45))}
body.menu #hud{visibility:hidden}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.box{background:rgba(4,12,24,.8);border:2px solid rgba(255,255,255,.22);box-shadow:0 0 0 2px #000,0 6px 0 rgba(0,0,0,.35);padding:8px 14px}
small{display:block;color:var(--muted);font-size:15px;letter-spacing:2px;text-transform:uppercase}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
.hb b{display:block;font-size:30px;color:var(--accent);line-height:1}
.hb.r{text-align:right}
#pips{display:flex;gap:6px;margin-top:6px}
#pips i{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4)}
#pips i.on{border-color:var(--accent)}
#tools{position:fixed;z-index:7;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 68px);display:flex;flex-direction:column;gap:8px}
.ib{font:inherit;font-size:22px;width:40px;height:40px;background:rgba(4,12,24,.8);color:var(--text);border:2px solid rgba(255,255,255,.25);box-shadow:0 0 0 2px #000;cursor:pointer;padding:0}
.ib:active{transform:translateY(2px)}
#zone{position:fixed;z-index:5;left:0;right:0;top:calc(max(10px,env(safe-area-inset-top)) + 70px);text-align:center;pointer-events:none;font-size:30px;letter-spacing:6px;color:var(--accent);text-shadow:0 0 0 #000,2px 2px 0 #000;opacity:0}
#zone.go{animation:zone 2.8s ease-out}
@keyframes zone{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#slam{position:fixed;z-index:6;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-size:clamp(30px,10vw,64px);letter-spacing:4px;text-shadow:3px 3px 0 #000;opacity:0}
#slam.go{animation:slam 1.5s ease-out}
@keyframes slam{0%{opacity:0;transform:scale(3)}14%{opacity:1;transform:scale(1)}20%{transform:scale(1.08)}26%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#toast{position:fixed;z-index:8;left:50%;bottom:90px;transform:translateX(-50%);padding:6px 14px;background:rgba(0,0,0,.8);border:2px solid var(--accent);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#ui{position:fixed;inset:0;z-index:4;pointer-events:none}
#ui>*{pointer-events:auto}
.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);text-align:center}
.title h1{margin:0;font-size:clamp(56px,14vw,104px);letter-spacing:8px;line-height:.9;color:#fff;text-shadow:4px 0 #ff4f9a,-4px 0 #22d8ff;animation:flick 5s infinite}
@keyframes flick{0%,93%,100%{text-shadow:4px 0 #ff4f9a,-4px 0 #22d8ff}95%{text-shadow:-6px 2px #ff4f9a,6px -2px #22d8ff}97%{text-shadow:2px 0 #ff4f9a,-2px 0 #22d8ff}}
.title .st{letter-spacing:10px;color:var(--accent);font-size:24px;margin:6px 0 4px}
.title p{margin:6px 0 14px;color:#fff;text-shadow:2px 2px 0 #000;font-size:20px}
.pb{font:inherit;font-size:24px;letter-spacing:2px;color:var(--text);background:rgba(4,12,24,.85);border:2px solid var(--accent);box-shadow:0 0 0 2px #000,0 5px 0 rgba(0,0,0,.5);padding:8px 20px;margin:5px;cursor:pointer;text-transform:uppercase}
.pb:hover{background:rgba(255,255,255,.12)}
.pb:active{transform:translateY(3px);box-shadow:0 0 0 2px #000,0 2px 0 rgba(0,0,0,.5)}
.pb.big{display:block;width:100%;font-size:30px;padding:14px;margin:8px 0}
.pb.dim{border-color:rgba(255,255,255,.3)}
.pb:disabled{opacity:.45;cursor:default}
.sw{display:flex;justify-content:center;gap:8px;margin:10px 0}
.sw button{width:34px;height:34px;border:2px solid rgba(255,255,255,.5);box-shadow:0 0 0 2px #000;cursor:pointer;padding:0}
.sw button.on{border-color:#fff;outline:3px solid var(--accent)}
.hist{margin-top:8px;font-size:17px;color:var(--muted)}
.q{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 80px);width:min(92vw,640px);animation:cardIn .35s ease-out}
.q h2{margin:2px 0 4px;font-size:clamp(28px,6vw,40px);line-height:1.05;color:#fff}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--kb) + env(safe-area-inset-bottom));width:min(94vw,640px);display:flex;gap:8px;align-items:stretch}
.clock{min-width:56px;display:flex;align-items:center;justify-content:center;background:rgba(4,12,24,.85);border:2px solid var(--accent);box-shadow:0 0 0 2px #000;font-size:30px}
.clock.low{border-color:#ff5252;color:#ff8a80;animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bar input{flex:1;min-width:0;font:inherit;font-size:26px;padding:8px 12px;background:rgba(4,12,24,.9);color:#fff;border:2px solid rgba(255,255,255,.4);box-shadow:0 0 0 2px #000;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
.bar input:focus{border-color:var(--accent)}
.tbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--kb) + env(safe-area-inset-bottom));width:min(94vw,640px);height:6px;background:rgba(0,0,0,.5)}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.fb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,560px);max-height:48vh;overflow:auto;text-align:center;animation:fbIn .4s ease-out 1.25s both}
@keyframes fbIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.fb .t{font-size:36px;letter-spacing:3px;line-height:1}
.fb .pts{color:var(--accent);font-size:26px}
.fb p{margin:2px 0;color:#fff;font-size:20px}
.bars{text-align:left;margin:6px 0;font-size:17px}
.bar2{display:flex;align-items:center;gap:8px;margin:2px 0}
.bar2 .n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2 .b{flex:1;height:10px;background:rgba(255,255,255,.12)}
.bar2 .b i{display:block;height:100%;background:#6ec1ff}
.bar2.me .b i{background:var(--accent)}
.bar2.me{color:var(--accent)}
.bar2 .p{width:52px;text-align:right;color:var(--muted)}
.done{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:86vh;overflow:auto;text-align:center}
.done h1{margin:0;font-size:44px;letter-spacing:4px}
.done .big{font-size:56px;color:var(--accent);line-height:1}
table{width:100%;border-collapse:collapse;text-align:left;font-size:17px;margin:8px 0}
td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.12)}
td.r{text-align:right;white-space:nowrap}.qs{color:var(--muted);font-size:14px}.done{overflow-x:hidden}
.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{max-width:460px;font-size:20px;line-height:1.25}
@media (max-width:520px){.hb b{font-size:24px}#zone{font-size:22px;letter-spacing:3px}}
@media (prefers-reduced-motion:reduce){.title h1{animation:none}}
</style>
</head>

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function seedRng(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function variants(x){const out=[x];const w=x.replace(/^(a|an|the|my) /,"");out.push(w);if(/ies$/.test(w))out.push(w.slice(0,-3)+"y");if(/es$/.test(w))out.push(w.slice(0,-2));if(/s$/.test(w))out.push(w.slice(0,-1));out.push(w.replace(/ /g,""));return out}
function match(p,input){
  const x=norm(input);if(!x)return null;
  for(const v of variants(x)){const e=p.idx.get(v);if(e)return e}
  const w=x.replace(/^(a|an|the|my) /,"");
  if(w.length>=5){const lim=w.length>=9?2:1;let best=null,bd=9;
    for(const [k,e] of p.idx){if(k.length<5||Math.abs(k.length-w.length)>lim)continue;const d=lev(k,w);if(d<=lim&&d<bd){bd=d;best=e}}
    if(best)return best}
  return null;
}

const AU={ctx:null,master:null,muted:store.get("kr_mute",false),dr:null,

 tone(f,d,type,vol,to,at){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03)},
 noise(d,vol,f0,f1){if(!this.ctx)return;const c=this.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.Q.value=1.1;const t=c.currentTime;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(this.master);s.start(t)},

 tick(){this.tone(1100,.03,"square",.03)},

  const d=Math.min(GOAL,sc.depth);sc.vel=(d-prevDepth)/Math.max(dt,.001);
  for(const z of ZONES){if(z.m>0&&prevDepth<z.m&&d>=z.m){const e=$("#zone");e.textContent=z.n;e.classList.remove("go");void e.offsetWidth;e.classList.add("go");AU.ping()}}
  if(Math.abs(sc.vel)>40&&Math.random()<Math.min(1,dt*Math.abs(sc.vel)/80)){sc.bub.push({x:W/2+8+Math.random()*10-5,y:subWorldY()-2,s:6+Math.random()*10,r:Math.random()<.3?2:1})}
  prevDepth=d;
  for(const b of sc.bub){b.y-=b.s*dt*(1+Math.abs(sc.vel)/120);b.x+=Math.sin(sc.t*3+b.y*.2)*.15}
  sc.bub=sc.bub.filter(b=>b.y>SY0-6&&sc.bub.length<120);
  for(const r of sc.ring)r.r+=dt*40;sc.ring=sc.ring.filter(r=>r.r<60);
  if(sc.shake>0)sc.shake=Math.max(0,sc.shake-dt*6);
  $("#depth").textContent=Math.round(d)+"m";
  AU.droneSet(d/GOAL);
}
const subWorldY=()=>SY0+Math.min(GOAL,sc.depth)*PXM+7;
function drawScene(){
  const d=Math.min(GOAL,sc.depth),sw=subWorldY(),cam=Math.max(0,sw-H*.42);sc.cam=cam;const dy=cam-sc.prevCam;sc.prevCam=cam;
  const surf=SY0-cam,t=sc.t;
  if(sc.shake>0&&!RM){cv.style.transform="translate("+((Math.random()-.5)*sc.shake*14|0)+"px,"+((Math.random()-.5)*sc.shake*14|0)+"px)"}else if(cv.style.transform)cv.style.transform="";
  /* sky */
  if(surf>0){for(let y=0;y<surf;y+=3){cx.fillStyle=rgb(mixRGB(theme.s[0],theme.s[1],y/Math.max(1,SY0)));cx.fillRect(0,y,W,3)}
    const sx=Math.round(W*.78),sy=Math.round(SY0*.42-cam);disc(sx,sy,15,"rgba(255,255,255,.12)");disc(sx,sy,10,theme.sun);
    cx.fillStyle=theme.cloud;for(const c of sc.clouds){const x=((c.x+t*c.s)%(W+50)+W+50)%(W+50)-25,y=Math.round(SY0*c.y-cam);cx.fillRect(x,y,c.w,3);cx.fillRect(x+3,y-2,c.w-6,2);cx.fillRect(x+7,y-3,Math.max(4,c.w-14),1)}}
  /* water */
  const y0=Math.max(0,Math.floor(surf));
  for(let y=y0;y<H;y+=3){const wy=y+cam;cx.fillStyle=rgb(wcol((Math.floor((wy-SY0)/3)*3)/PXM));cx.fillRect(0,y,W,3)}
  /* light rays */
  if(d<320&&surf<H){const a=(1-clamp((cam*0+ (SY0+d*PXM-SY0)/PXM)/320,0,1))*.13;
    cx.fillStyle="rgba(255,255,255,"+a.toFixed(3)+")";for(let r=0;r<5;r++){const bx=r*W/4+Math.sin(t*.4+r*2)*8;const h=Math.min(H-surf,90);for(let y=0;y<h;y+=2){cx.fillRect(bx+y*.45,surf+y,5+(r%2)*3,2)}}}
  /* surface line */
  if(surf>-4&&surf<H){for(let x=0;x<W;x+=2){const o=Math.round(Math.sin(x*.28+t*2.2)*.9);cx.fillStyle="rgba(255,255,255,.5)";cx.fillRect(x,surf+o,2,1);cx.fillStyle="rgba(255,255,255,.18)";cx.fillRect(x,surf+o+1,2,2)}}
  /* landmarks */
  cx.font="5px monospace";cx.textBaseline="bottom";
  for(const z of ZONES){const y=SY0+z.m*PXM-cam;if(z.m>0&&y>-8&&y<H+8){cx.fillStyle="rgba(255,255,255,.35)";for(let x=0;x<W;x+=6)cx.fillRect(x,Math.round(y),3,1);cx.fillStyle=theme.glow;cx.fillText(z.n,4,Math.round(y)-1)}}
  for(const l of LAND){const y=SY0+l.m*PXM-cam;if(y>-8&&y<H+8){cx.fillStyle="rgba(255,255,255,.22)";for(let x=0;x<W;x+=8)cx.fillRect(x,Math.round(y),2,1);cx.fillStyle="rgba(255,255,255,.75)";cx.textAlign="right";cx.fillText(l.t,W-4,Math.round(y)-1);cx.textAlign="left"}}
  /* floor */
  const yf=SY0+GOAL*PXM-cam;
  if(yf<H){const fc=mixRGB(theme.w[5],theme.glowC,.1);for(let x=0;x<W;x++){const h=Math.round(Math.sin(x*.21)*2+Math.sin(x*.07)*3);cx.fillStyle=rgb(fc);cx.fillRect(x,yf+h,1,H-yf)}
    cx.fillStyle=rgb(mixRGB(fc,theme.glowC,.25));for(let x=0;x<W;x+=11)cx.fillRect(x,yf+Math.round(Math.sin(x*.21)*2+Math.sin(x*.07)*3),2,1)}
  /* creatures */
  const k0=Math.floor((cam-60)/48),k1=Math.floor((cam+H+60)/48);
  for(let k=k0;k<=k1;k++){if(k<0)continue;for(const e of bandEnts(k)){const wy=e.y;if(wy<SY0+10||wy>SY0+GOAL*PXM-10)continue;
    const m=(wy-SY0)/PXM,span=W+90,x=(((e.x0+e.sp*t)%span)+span)%span-45,y=wy-cam+Math.sin(t*1.2+e.ph)*1.6,flip=e.sp<0;
    const frames=e.type==="ghost"?SPR.fish:SPR[e.type],fr=frames[Math.floor(t*2+e.ph)%2];
    let base=mixRGB(theme.fishC,theme.glowC,clamp(m/3000,0,1)*.6);if(e.type==="ghost")base=mixRGB(theme.glowC,[255,255,255],.35);
    const bc=rgb(mixRGB(base,wcol(m),clamp(m/6500,0,.45))),belly=rgb(mixRGB(base,[255,255,255],.4)),pal={"#":bc,b:belly,o:"#ffffff",l:theme.glow};
    if(e.type==="angler"||e.type==="jelly"||e.type==="ghost"){const gc=theme.glowC.map(v=>v|0).join(",");disc(Math.round(x+4),Math.round(y+4),9,"rgba("+gc+",.07)");disc(Math.round(x+4),Math.round(y+4),5,"rgba("+gc+",.10)")}
    spr(fr,x,y,pal,flip)}}
  /* marine snow */
  cx.fillStyle="rgba(255,255,255,.55)";
  for(const s of sc.snow){s.y-=dy*s.l+.05*s.l;s.x+=Math.sin(t+s.y*.05)*.04;if(s.y<0)s.y+=H;if(s.y>H)s.y-=H;if(s.x<0)s.x+=W;if(s.x>W)s.x-=W;if(s.y>surf+2)cx.fillRect(s.x|0,s.y|0,1,1)}
  /* speed streaks */
  if(Math.abs(sc.vel)>60){cx.fillStyle="rgba(255,255,255,.18)";const n=Math.min(18,Math.abs(sc.vel)/30|0);for(let i=0;i<n;i++){const x=(i*37+((t*50)|0)*7)%W,y=(i*53+((t*260)|0))%H;cx.fillRect(x,H-y,1,6+Math.abs(sc.vel)/40|0)}}
  /* boat + cable + sub */
  const bx=Math.round(W/2-34),sx=Math.round(W/2+4+Math.sin(t*.9)*2),sy=Math.round(sw-cam+Math.sin(t*1.7)*(d<8?1.2:.6));
  cx.strokeStyle="rgba(255,255,255,.45)";cx.lineWidth=1;cx.beginPath();cx.moveTo(bx+7,surf+1);cx.lineTo(sx+6,sy-4);cx.stroke();
  if(surf>-20&&surf<H+10){spr(BOAT,bx,Math.round(surf-6+Math.sin(t*1.3)*.8),{"#":"#2b2b3c"},false)}
  for(const r of sc.ring){cx.strokeStyle="rgba(255,255,255,"+(1-r.r/60).toFixed(2)+")";cx.beginPath();cx.arc(sx+7,sy,r.r,0,6.3);cx.stroke()}
  const body=theme.accent,pal={"#":body,y:rgb(mixRGB(hexRGB(body),[0,0,0],.4)),w:"#bff3ff"};
  spr(SUB,sx,sy-4,pal,false);
  cx.fillStyle=Math.floor(t*14)%2?"#ffffff":"#9aa";cx.fillRect(sx-1,sy-1,1,3);cx.fillRect(sx-2,sy-2+(Math.floor(t*14)%2)*2,1,1);
  if(d>350){const g=cx.createRadialGradient(sx+16,sy,1,sx+30,sy,28);g.addColorStop(0,"rgba(255,255,200,.28)");g.addColorStop(1,"rgba(255,255,200,0)");cx.fillStyle=g;cx.fillRect(sx+8,sy-26,56,52)}
  /* bubbles */
  cx.fillStyle="rgba(255,255,255,.75)";for(const b of sc.bub){const by=b.y-cam;if(by>surf)cx.fillRect(b.x|0,by|0,b.r,b.r)}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(st&&st.phase==="answering")tickClock(now);
  updateScene(dt,now);drawScene();requestAnimationFrame(frame)}

/* ================= game state + screens ================= */
let st=null;const ui=$("#ui");
const best=()=>store.get("kr_best",0);
function setScore(n){$("#score").textContent=n}
function pips(){const el=$("#pips");el.innerHTML="";if(!st)return;for(let i=0;i<ROUNDS;i++){const e=document.createElement("i");const l=st.log[i];if(l){e.className="on";e.style.background=l.tier?l.tier.col:"#555"}else if(i===st.i&&st.phase!=="done"){e.className="on"}el.appendChild(e)}}
function swatches(){return '<div class="sw">'+THEMES.map((t,i)=>'<button title="'+t.name+'" data-t="'+i+'" style="background:'+t.sw+'"></button>').join("")+"</div>"}
function bindSw(){ui.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>{AU.click();setTheme(+b.dataset.t,true)});setTheme(themeIdx)}
function title(){
  st=null;sc.anim=null;sc.depth=0;prevDepth=0;sc.bub=[];setScore(0);pips();AU.droneOff();document.body.classList.add("menu");
  const hist=store.get("kr_hist",[]).slice(0,4);
  ui.innerHTML='<div class="title"><h1>KRILLION</h1><div class="st">THE DAILY DIVE</div><p>'+ROUNDS+' prompts &middot; '+TIME+' seconds each &middot; rarer answers sink deeper</p>'+
   '<button class="pb big" id="daily">&#9660; DAILY DIVE &#9660;</button><div><button class="pb dim" id="free">RANDOM DIVE</button><button class="pb dim" id="how">HOW TO PLAY</button></div>'+swatches()+
   '<div class="hist">BEST SCORE '+best()+(hist.length?" &nbsp;|&nbsp; LAST: "+hist.map(h=>h.score).join(" &middot; "):"")+"</div></div>";
  $("#daily").onclick=()=>{AU.init();AU.click();start(true)};$("#free").onclick=()=>{AU.init();AU.click();start(false)};
  $("#how").onclick=how;bindSw();
}
function how(){AU.click();const m=document.createElement("div");m.className="modal";
  m.innerHTML='<div class="box"><b style="color:var(--accent);font-size:26px">HOW TO PLAY</b><br>Each prompt has many valid answers. We know how often people give each one.<br><br>&bull; Common answers dig a little.<br>&bull; <b>Rare answers sink you much deeper.</b><br>&bull; Reach 7,000 m in 7 rounds. Unknown answers score nothing.<br><br><button class="pb" id="ok">GOT IT</button></div>';
  document.body.appendChild(m);m.querySelector("#ok").onclick=()=>{AU.click();m.remove()};m.onclick=e=>{if(e.target===m)m.remove()}}
function start(daily){document.body.classList.remove("menu");
  if(daily){const done=store.get("kr_daily_"+today(),null);if(done){st={daily:true,log:done.log,depth:done.depth,score:done.score,i:ROUNDS,phase:"done",replay:true};sc.depth=done.depth;prevDepth=done.depth;setScore(done.score);pips();finish(true);return}}
  const rng=daily?seedRng("krillion"+today()):Math.random;
  st={daily,qs:shuffle(P,rng).slice(0,ROUNDS),i:0,depth:0,score:0,log:[],phase:"answering"};
  sc.depth=0;prevDepth=0;sc.anim=null;setScore(0);AU.droneOn();ask();
}
function ask(){
  const p=st.qs[st.i];st.phase="answering";st.sub=false;pips();
  ui.innerHTML='<div class="q box"><small>PROMPT '+(st.i+1)+' / '+ROUNDS+'</small><h2>'+esc(p[0])+'</h2><small style="font-size:14px">&#9662; rarer answers sink deeper</small></div>'+
   '<div class="tbar"><i id="tb"></i></div><form class="bar" id="f" autocomplete="off"><div class="clock" id="clk">'+TIME+'</div><input id="ans" type="text" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="type your answer..."><button class="pb" type="submit" style="margin:0">DIVE</button></form>';
  const inp=$("#ans");setTimeout(()=>inp.focus(),50);
  st.deadline=performance.now()+TIME*1000;st.lastSec=TIME;
  $("#f").onsubmit=e=>{e.preventDefault();submit()};
  inp.oninput=()=>{if(Math.random()<.5)AU.tone(500+Math.random()*300,.03,"square",.015)};
}
function tickClock(now){const left=Math.max(0,(st.deadline-now)/1000),tb=$("#tb"),clk=$("#clk");if(!tb)return;tb.style.width=(left/TIME*100)+"%";const s=Math.ceil(left);
  if(s!==st.lastSec){st.lastSec=s;clk.textContent=s;if(s<=5&&s>0)AU.tick();clk.classList.toggle("low",s<=5)}
  if(left<=0)submit()}
function submit(){if(!st||st.phase!=="answering"||st.sub)return;st.sub=true;const inp=$("#ans"),raw=inp?inp.value:"";if(inp)inp.blur();resolve(raw)}
function resolve(raw){
  const p=st.qs[st.i],e=match(p,raw);st.phase="feedback";
  let pct=null,tier=null,pts=0,score=0;
  if(e){pct=e[1]/p.total*100;tier=tierFor(pct);pts=Math.round(tier.m*(.88+.12*clamp(1-pct/10,0,1)));score=Math.round(100*Math.log2(1+100/pct))}
  const before=st.depth;st.depth=Math.min(GOAL,st.depth+pts);st.score+=score;
  st.log.push({q:p[0],a:raw.trim()||"-",pts,score,tier,pct});pips();
  const gain=st.depth-before;
  if(tier){AU.blub();AU.sink();sc.anim={from:sc.depth,to:st.depth,t0:performance.now(),dur:1300+tier.i*260,done:()=>{sc.shake=tier.i>=2?.4+tier.i*.15:.1;if(tier.i>=3){const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go")};sc.ring.push({r:2});AU.chime(tier.i);setScore(st.score);slam(tier.name,tier.col)}}}
  else{AU.miss();setTimeout(()=>slam("NOT IN THE RECORDS","#ef9a9a"),150)}
  const top=p[1].slice().sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bars=top.map(a=>{const v=a[1]/p.total*100;return '<div class="bar2'+(e&&a===e?" me":"")+'"><span class="n">'+esc(a[0])+'</span><span class="b"><i style="width:'+Math.min(v*2.5,100)+'%"></i></span><span class="p">'+v.toFixed(v<1?2:1)+"%</span></div>"}).join("");
  const last=st.i+1>=ROUNDS;
  ui.innerHTML='<div class="fb box">'+(e?'<div class="t" style="color:'+tier.col+'">'+tier.name+'</div><p>"'+esc(raw.trim())+'" was given by <b>'+pct.toFixed(pct<1?2:1)+'%</b> of divers</p><div class="pts">+'+gain+'m &nbsp; +'+score+' pts</div>':
   '<div class="t" style="color:#ef9a9a">NOT IN THE RECORDS</div><p>'+(raw.trim()?'"'+esc(raw.trim())+'" wasn\'t recognised. Check the spelling next time.':"Time ran out.")+'</p>')+
   '<div class="bars"><small>top answers</small>'+bars+'</div><button class="pb" id="nx">'+(last?"SURFACE":"NEXT")+' &#9654;</button></div>';
  const nx=$("#nx");nx.disabled=true;setTimeout(()=>{nx.disabled=false;nx.focus()},tier?1400+tier.i*260:900);
  nx.onclick=()=>{AU.click();st.i++;st.i<ROUNDS?ask():finish()};
  nx.onkeydown=ev=>{if(ev.repeat)ev.preventDefault()};
}
function slam(txt,col){const e=$("#slam");e.textContent=txt;e.style.color=col;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
function finish(replay){
  st.phase="done";AU.droneOff();pips();["#slam","#zone"].forEach(function(q){$(q).classList.remove("go")});
  const d=st.depth,sco=st.score;
  if(!replay){if(sco>best())store.set("kr_best",sco);const h=store.get("kr_hist",[]);h.unshift({date:today(),mode:st.daily?"Daily":"Random",depth:d,score:sco});store.set("kr_hist",h.slice(0,20));if(st.daily)store.set("kr_daily_"+today(),{depth:d,score:sco,log:st.log});AU.fan()}
  const win=d>=GOAL,emo={COMMON:"⬜",UNCOMMON:"🟩",RARE:"🟦",EPIC:"🟪",LEGENDARY:"🟨"};
  const share="Krillion "+(st.daily?today():"(random)")+"\nDepth: "+d+"m"+(win?" TROPHY":"")+"  Score: "+sco+"\n"+st.log.map(l=>l.tier?emo[l.tier.name]:"⬛").join("");
  ui.innerHTML='<div class="done box"><h1>'+(win?"ABYSS REACHED!":"SURFACING...")+'</h1><div class="big">'+d+'m</div><div style="color:#fff">SCORE '+sco+(sco>=best()&&!replay?" &nbsp;NEW BEST!":" &nbsp;(best "+best()+")")+'</div>'+(replay?'<div style="color:var(--muted)">You already did today\'s dive. Come back tomorrow!</div>':"")+
   "<table>"+st.log.map(l=>'<tr><td><span class="qs">'+esc(l.q)+'</span><br>'+esc(l.a)+'</td><td class="r" style="color:'+(l.tier?l.tier.col:"#ef9a9a")+'">'+(l.tier?l.tier.name:"MISS")+'</td></tr>').join("")+"</table>"+
   '<button class="pb" id="cp">COPY RESULT</button><button class="pb dim" id="rnd">RANDOM DIVE</button><button class="pb dim" id="mn">MENU</button></div>';
  $("#cp").onclick=()=>{AU.click();const b=$("#cp");try{navigator.clipboard.writeText(share).then(()=>{b.textContent="COPIED!"},()=>prompt("Copy:",share))}catch(e){prompt("Copy:",share)}};
  $("#rnd").onclick=()=>{AU.click();start(false)};$("#mn").onclick=()=>{AU.click();title()};
}

/* ================= wiring ================= */
const bm=$("#bMute");const showMute=()=>{bm.textContent=AU.muted?"✕":"♪";bm.style.opacity=AU.muted?.6:1};showMute();
bm.onclick=()=>{AU.init();AU.setMute(!AU.muted);showMute();AU.click();toast(AU.muted?"SOUND OFF":"SOUND ON")};
$("#bTheme").onclick=()=>{AU.click();setTheme((themeIdx+1)%THEMES.length,true)};
setTheme(themeIdx);title();requestAnimationFrame(frame);
</script>
</body>
